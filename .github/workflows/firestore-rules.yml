# Runs the Firestore rules tests in the emulator whenever the rules,
# their tests or the tooling that runs them change.
name: Firestore rules

on:
  push:
    branches: [master]
    paths:
      - firestore.rules
      - tests/firestore.rules.test.js
      - firebase.json
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - tests/firestore.rules.test.js
      - firebase.json
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules.yml

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules
