<html><head><meta charset="utf-8"><title>Logo check</title>

<body>
  <div class="row pair"><img src="_wm_ref.png?v=2" alt="ref"><img src="img/brand/trending-logo.svg?v=1" alt="new"></div>

  <div class="row dark"><div class="hdr d"><img src="img/brand/trending-logo-light.svg?v=1" style="height:40px"></div><img src="img/brand/trending-logo-light.svg?v=1" style="height:120px"></div>
